name: Update README

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  push:
    branches: [master]
    paths: ["content/**", "config/**", "src/**", ".github/workflows/update-readme.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build README
        run: npm run build
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README"
          git push
